[project]
name = "nfactory-api"
version = "0.1.0"
description = "API FastAPI de NFactory"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "fastapi>=0.162.0",
    "nfactory-core",
    "python-multipart>=0.0.20",
    "redis>=5.2,<6",
    "sse-starlette>=3.6.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
nfactory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
