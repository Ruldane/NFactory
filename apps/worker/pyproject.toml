[project]
name = "nfactory-worker"
version = "0.1.0"
description = "Worker NFactory : jobs ARQ + orchestration LangGraph"
requires-python = ">=3.13,<3.14"
dependencies = [
    "arq>=0.28.0",
    "httpx>=0.28",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3.2.0",
    "nfactory-core",
]

[tool.uv.sources]
nfactory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nfactory_worker"]
