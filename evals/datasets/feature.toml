# Repo feature scenarios (spec §14.2: 6 repo feature). Each adds a feature to a project
# NFactory delivered first (scenario E: a change request is a child run). The change is
# rebuilt, tested again, and delivered with modifications.diff.
# A feature written by Codex on the user's own repository needs the user's account
# and consent: it is tested by hand, not by these automatic evals.

[[case]]
id = "feature-departement"
project_type = "api"
title = "Annuaire"
parent_request = "Une API d'annuaire des contacts"
request = "Ajoute un filtre par département"
[case.expect]
fields = ["departement"]
contains = { "app/models.py" = ["departement"] }
min_tests = 9
max_diff_lines = 400
deliverables = [".zip", ".diff"]

