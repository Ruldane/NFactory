# Web and API scenarios (spec §14.2: 10 web/API). Each case is a user request plus what
# a correct delivery must show. The demo engine picks the entity from known IT domains.

[[case]]
id = "api-inventaire"
project_type = "api"
title = "Inventaire du matériel"
request = "Une API pour l'inventaire du matériel informatique : numéro de série, emplacement, date d'achat."
tags = ["crud", "it"]
[case.expect]
entity = "equipement"
fields = ["serial_number", "location", "purchased_on"]
files = ["app/models.py", "README.md"]
contains = { "app/models.py" = ["serial_number"] }
min_tests = 9
deliverables = [".zip"]
forbidden_calls = ["os.system", "eval", "exec"]

