# Excel scenarios (spec §14.2: 8 Excel). The deliverable is a real .xlsx built by a
# script the checks run, with formula tests.

[[case]]
id = "excel-heures"
project_type = "excel"
title = "Suivi des heures"
request = "Un classeur de suivi des heures par semaine et par équipe."
tags = ["kpi"]
[case.expect]
files = ["build_report.py", "tests/test_report.py"]
min_tests = 7
deliverables = [".xlsx", ".zip"]

[[case]]
id = "excel-budget"
project_type = "excel"
title = "Budget informatique"
request = "Un tableau du budget informatique : prévu, engagé et écart par poste."
tags = ["finance"]
[case.expect]
contains = { "build_report.py" = ["Budget informatique"] }
min_tests = 7
deliverables = [".xlsx"]

