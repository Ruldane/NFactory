# PowerShell scenarios (spec §14.2: 6 PowerShell). Checks run PSScriptAnalyzer and
# Pester in the sandbox image; without pwsh, the local runner skips these cases.

[[case]]
id = "ps-temp"
project_type = "powershell"
title = "Nettoyage des dossiers temporaires"
request = "Un script qui nettoie les fichiers temporaires de plus de 30 jours, avec -WhatIf."
tags = ["maintenance"]
[case.expect]
min_tests = 9
deliverables = [".zip"]

