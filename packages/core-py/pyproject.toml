[project]
name = "nfactory-core"
version = "0.1.0"
description = "Modèles, schémas, machine d'états et contrats partagés par l'API et le worker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography>=44",
    "httpx>=0.28",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=6",
    "python-docx>=1.2",
    "sqlalchemy[asyncio]>=2.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfactory_core"]
